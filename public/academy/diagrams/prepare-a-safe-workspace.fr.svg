<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Leçon 3</title><desc id="desc">L’imprimante se trouve dans une zone de fonctionnement délimitée. Un trajet distinct représente la maîtrise des émissions; l’accès à l’arrêt reste dégagé.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17201d"/></marker></defs><rect width="640" height="480" fill="#fff"/><g fill="none" stroke="#17201d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, sans-serif"><rect x="40" y="60" width="390" height="295" rx="3" fill="#f4f7f5" stroke="#17201d"/><rect x="100" y="110" width="270" height="175" rx="3" fill="#fff" stroke="#17201d"/><rect x="160" y="155" width="150" height="85" rx="3" fill="#fff" stroke="#17201d"/><path d="M180 145v-35h90v35" stroke="#17201d" stroke-width="3" fill="none"/><rect x="327" y="305" width="60" height="32" rx="3" fill="#fff" stroke="#17201d" stroke-width="7"/><rect x="327" y="305" width="60" height="32" rx="3" fill="#fff" stroke="#FF6A00"/><text x="357" y="329" fill="#17201d" stroke="none" font-size="24" text-anchor="middle"><tspan x="357" dy="0">Arrêt</tspan></text><path d="M357 395L357 346" stroke="#17201d" marker-end="url(#arrow)" stroke-width="7"/><path d="M357 395L357 346" stroke="#FF6A00" marker-end="url(#arrow)"/><path d="M210 110L210 35" stroke="#17201d" marker-end="url(#arrow)" stroke-width="7"/><path d="M210 110L210 35" stroke="#04D9C4" marker-end="url(#arrow)"/><path d="M220 35L445 35" stroke="#17201d" marker-end="url(#arrow)" stroke-width="7"/><path d="M220 35L445 35" stroke="#04D9C4" marker-end="url(#arrow)"/><text x="448" y="45" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="448" dy="0">Captage</tspan><tspan x="448" dy="31">prévu</tspan></text><text x="453" y="172" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="453" dy="0">Zone de</tspan><tspan x="453" dy="31">mouvement</tspan></text><path d="M443 182L375 182" stroke="#17201d" marker-end="url(#arrow)"/><text x="180" y="390" fill="#17201d" stroke="none" font-size="26" text-anchor="middle"><tspan x="180" dy="0">Accès libre</tspan></text><text x="30" y="437" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="30" dy="0">Vue de dessus; aucun débit imposé</tspan></text></g></svg>
