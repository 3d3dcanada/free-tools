<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Lesson 19</title><desc id="desc">Two trial points lie inside an unnumbered supported temperature interval and lead to separately labelled samples. The interval has no universal endpoints.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17201d"/></marker></defs><rect width="640" height="480" fill="#fff"/><g fill="none" stroke="#17201d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, sans-serif"><text x="58" y="63" fill="#17201d" stroke="none" font-size="26" text-anchor="start"><tspan x="58" dy="0">Maker-supported interval</tspan></text><path d="M70 145L570 145" stroke="#17201d"/><path d="M70 127L70 163" stroke="#17201d"/><path d="M570 127L570 163" stroke="#17201d"/><circle cx="220" cy="145" r="12" stroke="#17201d" fill="#FF6A00" stroke-width="7"/><circle cx="220" cy="145" r="12" stroke="#FF6A00" fill="#FF6A00"/><circle cx="430" cy="145" r="12" stroke="#17201d" fill="#04D9C4" stroke-width="7"/><circle cx="430" cy="145" r="12" stroke="#04D9C4" fill="#04D9C4"/><path d="M220 174L220 230" stroke="#17201d" marker-end="url(#arrow)" stroke-width="7"/><path d="M220 174L220 230" stroke="#FF6A00" marker-end="url(#arrow)"/><path d="M430 174L430 230" stroke="#17201d" marker-end="url(#arrow)" stroke-width="7"/><path d="M430 174L430 230" stroke="#04D9C4" marker-end="url(#arrow)"/><rect x="155" y="278" width="110" height="85" rx="3" fill="#f4f7f5" stroke="#17201d"/><path d="M155 278l22 -22h110v85l-22 22M265 278l22 -22" stroke="#17201d" stroke-width="3" fill="none"/><rect x="380" y="278" width="110" height="85" rx="3" fill="#f4f7f5" stroke="#17201d"/><path d="M380 278l22 -22h110v85l-22 22M490 278l22 -22" stroke="#17201d" stroke-width="3" fill="none"/><text x="209" y="406" fill="#17201d" stroke