<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Lesson 25</title><desc id="desc">Two separated halves have a locating peg and socket. Assembly arrows meet at the planned joint; locating does not imply a tested retaining force.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17201d"/></marker></defs><rect width="640" height="480" fill="#fff"/><g fill="none" stroke="#17201d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, sans-serif"><rect x="50" y="135" width="165" height="160" rx="3" fill="#f4f7f5" stroke="#17201d"/><path d="M50 135l22 -22h165v160l-22 22M215 135l22 -22" stroke="#17201d" stroke-width="3" fill="none"/><rect x="215" y="194" width="65" height="55" rx="3" fill="#f4f7f5" stroke="#17201d" stroke-width="7"/><rect x="215" y="194" width="65" height="55" rx="3" fill="#f4f7f5" stroke="#04D9C4"/><rect x="400" y="135" width="165" height="160" rx="3" fill="#f4f7f5" stroke="#17201d"/><path d="M400 135l22 -22h165v160l-22 22M565 135l22 -22" stroke="#17201d" stroke-width="3" fill="none"/><rect x="400" y="184" width="60" height="70" rx="3" fill="#fff" stroke="#17201d" stroke-width="7"/><rect x="400" y="184" width="60" height="70" rx="3" fill="#fff" stroke="#FF6A00"/><path d="M292 215L367 215" stroke="#17201d" marker-end="url(#arrow)"/><path d="M337 70L337 355" stroke="#17201d" stroke-dasharray="7 7" stroke-width="7"/><path d="M337 70L337 355" stroke="#FF2D92" stroke-dasharray="7 7"/><text x="167" y="365" fill="#17201d" stroke="none" font-size="26" text-anchor="middle"><tspan x="167" dy="0">Locating peg</tspan></text><text x="484" y="365" fill="#17201d" stroke="none" font-size="26" text-anchor="middle"><tspan x="484" dy="0">Socket</tspan></text><text x="30" y="437" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="30" dy="0">Locate first; plan retention separately</tspan></text></g></svg>
