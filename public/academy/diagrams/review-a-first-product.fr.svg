<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Leçon 40</title><desc id="desc">Un dossier mène à trois décisions humaines : examiner, réviser ou arrêter. Aucun chemin de publication automatique ni symbole de certification n’apparaît.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17201d"/></marker></defs><rect width="640" height="480" fill="#fff"/><g fill="none" stroke="#17201d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, sans-serif"><rect x="215" y="35" width="230" height="140" rx="3" fill="#fff" stroke="#17201d"/><path d="M410 35v35h35" stroke="#17201d" stroke-width="3" fill="none"/><text x="237" y="80" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="237" dy="0">Dossier à examiner</tspan></text><path d="M237 112L416 112" stroke="#17201d" stroke-width="7"/><path d="M237 112L416 112" stroke="#04D9C4"/><path d="M237 144L390 144" stroke="#17201d" stroke-width="7"/><path d="M237 144L390 144" stroke="#FF6A00"/><path d="M330 192L330 220" stroke="#17201d"/><path d="M110 220L530 220" stroke="#17201d"/><path d="M110 225L110 285" stroke="#17201d" marker-end="url(#arrow)" stroke-width="7"/><path d="M110 225L110 285" stroke="#04D9C4" marker-end="url(#arrow)"/><rect x="25" y="305" width="170" height="85" rx="3" fill="#fff" stroke="#17201d"/><text x="110" y="357" fill="#17201d" stroke="none" font-size="26" text-anchor="middle"><tspan x="110" dy="0">Examiner</tspan></text><path d="M320 225L320 285" stroke="#17201d" marker-end="url(#arrow)" stroke-width="7"/><path d="M320 225L320 285" stroke="#FF6A00" marker-end="url(#arrow)"/><rect x="235" y="305" width="170" height="85" rx="3" fill="#fff" stroke="#17201d"/><text x="320" y="357" fill="#17201d" stroke="none" font-size="26" text-anchor="middle"><tspan x="320" dy="0">Réviser</tspan></text><path d="M530 225L530 285" stroke="#17201d" marker-end="url(#arrow)" stroke-width="7"/><path d="M530 225L530 285" stroke="#FF2D92" marker-end="url(#arrow)"/><rect x="445" y="305" width="170" height="85" rx="3" fill="#fff" stroke="#17201d"/><text x="530" y="357" fill="#17201d" stroke="none" font-size="26" text-anchor="middle"><tspan x="530" dy="0">Arrêter</tspan></text><text x="30" y="437" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="30" dy="0">Décision humaine avant publication</tspan></text></g></svg>
