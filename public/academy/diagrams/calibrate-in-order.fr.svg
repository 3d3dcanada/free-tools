<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Leçon 17</title><desc id="desc">Une séquence passe de la préparation à la référence, puis à un réglage et à la comparaison. Une référence défaillante ramène à la préparation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17201d"/></marker></defs><rect width="640" height="480" fill="#fff"/><g fill="none" stroke="#17201d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, sans-serif"><rect x="160" y="37" width="400" height="60" rx="3" fill="#fff" stroke="#17201d"/><text x="178" y="76" fill="#17201d" stroke="none" font-size="26" text-anchor="start"><tspan x="178" dy="0">1. Préparer</tspan></text><path d="M365 100L365 124" stroke="#17201d" marker-end="url(#arrow)" stroke-width="7"/><path d="M365 100L365 124" stroke="#04D9C4" marker-end="url(#arrow)"/><rect x="160" y="132" width="400" height="60" rx="3" fill="#fff" stroke="#17201d"/><text x="178" y="171" fill="#17201d" stroke="none" font-size="26" text-anchor="start"><tspan x="178" dy="0">2. Référence</tspan></text><path d="M365 195L365 219" stroke="#17201d" marker-end="url(#arrow)" stroke-width="7"/><path d="M365 195L365 219" stroke="#04D9C4" marker-end="url(#arrow)"/><rect x="160" y="227" width="400" height="60" rx="3" fill="#fff" stroke="#17201d"/><text x="178" y="266" fill="#17201d" stroke="none" font-size="26" text-anchor="start"><tspan x="178" dy="0">3. Un réglage</tspan></text><path d="M365 290L365 314" stroke="#17201d" marker-end="url(#arrow)" stroke-width="7"/><path d="M365 290L365 314" stroke="#04D9C4" marker-end="url(#arrow)"/><rect x="160" y="322" width="400" height="60" rx="3" fill="#fff" stroke="#17201d"/><text x="178" y="361" fill="#17201d" stroke="none" font-size="26" text-anchor="start"><tspan x="178" dy="0">4. Comparer</tspan></text><path d="M151 161H90V67H145" stroke="#17201d"  fill="none" stroke-width="8"/><path d="M151 161H90V67H145" stroke="#FF6A00" stroke-width="4" fill="none"/><path d="M90 67L145 67" stroke="#17201d" marker-end="url(#arrow)" stroke-width="7"/><path d="M90 67L145 67" stroke="#FF6A00" marker-end="url(#arrow)"/><text x="28" y="424" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="28" dy="0">Référence ratée ? Revoir la préparation.</tspan></text></g></svg>
