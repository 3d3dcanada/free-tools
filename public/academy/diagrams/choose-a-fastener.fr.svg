<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Leçon 33</title><desc id="desc">Une coupe du corps imprimé montre un boulon traversant et un logement d’écrou accessible. Les flèches indiquent le trajet de charge sans couple ni capacité annoncés.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17201d"/></marker></defs><rect width="640" height="480" fill="#fff"/><g fill="none" stroke="#17201d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, sans-serif"><rect x="155" y="105" width="330" height="240" rx="3" fill="#f4f7f5" stroke="#17201d"/><rect x="155" y="195" width="330" height="60" rx="3" fill="#fff" stroke="#17201d"/><rect x="90" y="206" width="420" height="38" rx="3" fill="#fff" stroke="#17201d" stroke-width="7"/><rect x="90" y="206" width="420" height="38" rx="3" fill="#fff" stroke="#04D9C4"/><rect x="70" y="181" width="30" height="90" rx="3" fill="#fff" stroke="#17201d" stroke-width="7"/><rect x="70" y="181" width="30" height="90" rx="3" fill="#fff" stroke="#04D9C4"/><path d="M465 185h 50l25 40l-25 40h-50l-25 -40z" stroke="#17201d" stroke-width="4" fill="#fff"/><path d="M90 150L215 150" stroke="#17201d" marker-end="url(#arrow)" stroke-width="7"/><path d="M90 150L215 150" stroke="#FF6A00" marker-end="url(#arrow)"/><path d="M535 305L410 305" stroke="#17201d" marker-end="url(#arrow)" stroke-width="7"/><path d="M535 305L410 305" stroke="#FF6A00" marker-end="url(#arrow)"/><text x="60" y="70" fill="#17201d" stroke="none" font-size="26" text-anchor="start"><tspan x="60" dy="0">Boulon traversant</tspan></text><text x="365" y="90" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="365" dy="0">Logement d’écrou</tspan></text><text x="30" y="437" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="30" dy="0">Joint accessible; aucun couple prescrit</tspan></text></g></svg>
