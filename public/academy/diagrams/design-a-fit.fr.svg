<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Leçon 24</title><desc id="desc">Un jeu agrandi entre un tenon et une ouverture illustre le jeu total. Trois douilles portent les largeurs expérimentales 10,2, 10,4 et 10,6 mm.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17201d"/></marker></defs><rect width="640" height="480" fill="#fff"/><g fill="none" stroke="#17201d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, sans-serif"><rect x="60" y="70" width="195" height="175" rx="3" fill="#fff" stroke="#17201d"/><rect x="90" y="100" width="135" height="115" rx="3" fill="#f4f7f5" stroke="#17201d" stroke-width="7"/><rect x="90" y="100" width="135" height="115" rx="3" fill="#f4f7f5" stroke="#04D9C4"/><path d="M60 245L60 280" stroke="#17201d"/><path d="M90 215L90 280" stroke="#17201d"/><path d="M60 270L90 270" stroke="#17201d"/><path d="M60 263L60 277" stroke="#17201d"/><path d="M90 263L90 277" stroke="#17201d"/><text x="157" y="312" fill="#17201d" stroke="none" font-size="26" text-anchor="middle"><tspan x="157" dy="0">Jeu par côté</tspan></text><text x="310" y="85" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="310" dy="0">Jeu total =</tspan><tspan x="310" dy="31">ouverture − tenon</tspan></text><text x="310" y="174" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="310" dy="0">= 2 × jeu par côté</tspan></text><text x="310" y="239" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="310" dy="0">Jeu agrandi</tspan></text><rect x="50" y="350" width="150" height="60" rx="3" fill="#fff" stroke="#17201d"/><rect x="100" y="365" width="50" height="30" rx="3" fill="#f4f7f5" stroke="#17201d" stroke-width="7"/><rect x="100" y="365" width="50" height="30" rx="3" fill="#f4f7f5" stroke="#FF6A00"/><text x="125" y="453" fill="#17201d" stroke="none" font-size="26" text-anchor="middle"><tspan x="125" dy="0">10,2 mm</tspan></text><rect x="250" y="350" width="150" height="60" rx="3" fill="#fff" stroke="#17201d"/><rect x="300" y="365" width="50" height="30" rx="3" fill="#f4f7f5" stroke="#17201d" stroke-width="7"/><rect x="300" y="365" width="50" height="30" rx="3" fill="#f4f7f5" stroke="#FF6A00"/><text x="325" y="453" fill="#17201d" stroke="none" font-size="26" text-anchor="middle"><tspan x="325" dy="0">10,4 mm</tspan></text><rect x="450" y="350" width="150" height="60" rx="3" fill="#fff" stroke="#17201d"/><rect x="500" y="365" width="50" height="30" rx="3" fill="#f4f7f5" stroke="#17201d" stroke-width="7"/><rect x="500" y="365" width="50" height="30" rx="3" fill="#f4f7f5" stroke="#FF6A00"/><text x="525" y="453" fill="#17201d" stroke="none" font-size="26" text-anchor="middle"><tspan x="525" dy="0">10,6 mm</tspan></text></g></svg>
