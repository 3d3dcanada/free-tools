<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Lesson 10</title><desc id="desc">Starting and observation lead to cooling and inspection. A separate stop branch leaves the observation step when a failure is seen.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17201d"/></marker></defs><rect width="640" height="480" fill="#fff"/><g fill="none" stroke="#17201d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, sans-serif"><rect x="35" y="65" width="205" height="80" rx="3" fill="#fff" stroke="#17201d"/><text x="138" y="113" fill="#17201d" stroke="none" font-size="26" text-anchor="middle"><tspan x="138" dy="0">Start job</tspan></text><path d="M240 105L305 105" stroke="#17201d" marker-end="url(#arrow)"/><rect x="327" y="65" width="245" height="80" rx="3" fill="#fff" stroke="#17201d"/><text x="450" y="113" fill="#17201d" stroke="none" font-size="26" text-anchor="middle"><tspan x="450" dy="0">Observe</tspan></text><path d="M450 150L450 230" stroke="#17201d" marker-end="url(#arrow)" stroke-width="7"/><path d="M450 150L450 230" stroke="#FF6A00" marker-end="url(#arrow)"/><rect x="327" y="250" width="245" height="70" rx="3" fill="#fff" stroke="#17201d"/><text x="450" y="294" fill="#17201d" stroke="none" font-size="26" text-anchor="middle"><tspan x="450" dy="0">Stop if failing</tspan></text><path d="M320 115L180 240" stroke="#17201d" marker-end="url(#arrow)" stroke-width="7"/><path d="M320 115L180 240" stroke="#04D9C4" marker-end="url(#arrow)"/><path d="M60 303l18 -15h200l-18 15z" stroke="#17201d" stroke-width="3" fill="#eef2ef"/><rect x="110" y="245" width="95" height="44" rx="3" fill="#f4f7f5" stroke="#17201d"/><path d="M110 245l22 -22h95v44l-22 22M205 245l22 -22" stroke="#17201d" stroke-width="3" fill="none"/><text x="67" y="350" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="67" dy="0">Cool, then remove</tspan></text><text x="30" y="437" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="30" dy="0">Inspect the cooled physical result</tspan></text></g></svg>
