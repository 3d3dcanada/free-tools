<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Lesson 28</title><desc id="desc">A flat early layer is followed by a later curled corner. A timeline distinguishes initial attachment from subsequent lifting.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17201d"/></marker></defs><rect width="640" height="480" fill="#fff"/><g fill="none" stroke="#17201d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, sans-serif"><path d="M50 285l18 -15h210l-18 15z" stroke="#17201d" stroke-width="3" fill="#eef2ef"/><path d="M 60 261h190v15H60z" stroke="#17201d"  fill="#f4f7f5" stroke-width="8"/><path d="M 60 261h190v15H60z" stroke="#04D9C4" stroke-width="4" fill="#f4f7f5"/><path d="M380 285l18 -15h210l-18 15z" stroke="#17201d" stroke-width="3" fill="#eef2ef"/><path d="M389 272h115q45 0 65 -55l16 8q-22  60 -81 62H389z" stroke="#17201d"  fill="#f4f7f5" stroke-width="8"/><path d="M389 272h115q45 0 65 -55l16 8q-22  60 -81 62H389z" stroke="#FF6A00" stroke-width="4" fill="#f4f7f5"/><path d="M270 210L350 210" stroke="#17201d" marker-end="url(#arrow)"/><text x="165" y="90" fill="#17201d" stroke="none" font-size="26" text-anchor="middle"><tspan x="165" dy="0">Initially flat</tspan></text><text x="482" y="90" fill="#17201d" stroke="none" font-size="26" text-anchor="middle"><tspan x="482" dy="0">Later lifting</tspan></text><path d="M70 355L570 355" stroke="#17201d"/><circle cx="150" cy="355" r="7" stroke="#17201d" fill="#04D9C4" stroke-width="7"/><circle cx="150" cy="355" r="7" stroke="#04D9C4" fill="#04D9C4"/><circle cx="485" cy="355" r="7" stroke="#17201d" fill="#FF6A00" stroke-width="7"/><circle cx="485" cy="355" r="7" stroke="#FF6A00" fill="#FF6A00"/><text x="150" y="395" fill="#17201d" stroke="none" font-size="26" text-anchor="middle"><tspan x="1