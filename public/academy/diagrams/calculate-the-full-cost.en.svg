<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">Lesson 37</title><desc id="desc">Five fictional cost inputs add to CAD 8.85. Shipping and fees remain marked unknown in a separate row rather than appearing as zero.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17201d"/></marker></defs><rect width="640" height="480" fill="#fff"/><g fill="none" stroke="#17201d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, sans-serif"><text x="30" y="40" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="30" dy="0">Fictional teaching inputs (CAD)</tspan></text><text x="40" y="90" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="40" dy="0">Material</tspan></text><text x="305" y="90" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="305" dy="0">2.50</tspan></text><text x="40" y="140" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="40" dy="0">Labour</tspan></text><text x="305" y="140" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="305" dy="0">4.00</tspan></text><text x="40" y="190" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="40" dy="0">Machine</tspan></text><text x="305" y="190" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="305" dy="0">1.00</tspan></text><text x="40" y="240" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="40" dy="0">Power</tspan></text><text x="305" y="240" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="305" dy="0">0.10</tspan></text><text x="40" y="290" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="40" dy="0">Packing</tspan></text><text x="305" y="290" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="305" dy="0">1.25</tspan></text><path d="M30 318L590 318" stroke="#17201d" stroke-width="7"/><path d="M30 318L590 318" stroke="#04D9C4"/><text x="40" y="358" fill="#17201d" stroke="none" font-size="26" text-anchor="start"><tspan x="40" dy="0">Subtotal</tspan></text><text x="440" y="358" fill="#17201d" stroke="none" font-size="26" text-anchor="start"><tspan x="440" dy="0">8.85 CAD</tspan></text><text x="30" y="437" fill="#17201d" stroke="none" font-size="24" text-anchor="start"><tspan x="30" dy="0">Shipping / fees: unknown</tspan></text></g></svg>
